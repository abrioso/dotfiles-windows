name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Parse bootstrap in Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('install.ps1', 'setup.ps1', 'setup-functions.ps1', 'configure.ps1')
          if (Test-Path ./setup-scripts/configuration-ui.ps1) { $files += 'configuration-ui.ps1' }
          foreach ($file in $files) {
            $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Resolve-Path ./setup-scripts).Path $file), [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "Windows PowerShell 5.1 syntax errors in ${file}: $($parseErrors.Message -join '; ')" }
          }

      - name: Run repository validation
        shell: pwsh
        env:
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $arguments = @{ InstallDependencies = $true; ReportDirectory = (Join-Path $env:RUNNER_TEMP 'dotfiles-validation') }
          if ($env:VALIDATION_BASE_REF -and $env:VALIDATION_BASE_REF -notmatch '^0+$') {
            $arguments.BaseRef = $env:VALIDATION_BASE_REF
          }
          ./tests/Invoke-Validation.ps1 @arguments

      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ github.sha }}
          path: ${{ runner.temp }}/dotfiles-validation/
          if-no-files-found: warn
          retention-days: 30
