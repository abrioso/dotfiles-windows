name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repository validation
        shell: pwsh
        env:
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $arguments = @{ InstallDependencies = $true }
          if ($env:VALIDATION_BASE_REF -and $env:VALIDATION_BASE_REF -notmatch '^0+$') {
            $arguments.BaseRef = $env:VALIDATION_BASE_REF
          }
          ./tests/Invoke-Validation.ps1 @arguments
