# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  ########################################
  ### ASSERTIONS: System Requirements
  ########################################
  assertions:
    ### Assertion: OS Version
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/OsVersion
      id: OsVersion
      directives:
        description: Minimum OS version requirement
        allowPrerelease: true
      settings:
        MinVersion: "10.0.22000"
  ########################################
  resources:
    ########################################
    ### Features Installation: Hyper-V and WSL
    ########################################
    ########################################
    ### Install HypervisorPlatform Optional Feature
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: HypervisorPlatform
      directives:
        description: HypervisorPlatform
        allowPrerelease: true
      settings:
        Name: HypervisorPlatform
        Ensure: Present
    ### Install VirtualMachinePlatform Optional Feature
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: VirtualMachinePlatform
      directives:
        description: VirtualMachinePlatform
        allowPrerelease: true
      settings:
        Name: VirtualMachinePlatform
        Ensure: Present
    ### Install Microsoft-Windows-Subsystem-Linux Optional Feature
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: Microsoft-Windows-Subsystem-Linux
      directives:
        description: Microsoft-Windows-Subsystem-Linux
        allowPrerelease: true
      settings:
        Name: Microsoft-Windows-Subsystem-Linux
        Ensure: Present
    ########################################
    ### Install HyperV
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: hyperv 
      directives:
        description: Microsoft-Hyper-V-All 
        allowPrerelease: true
      settings:
        Name: Microsoft-Hyper-V-All 
        Ensure: Present

    ########################################
    ### Winget Package Installation: WSL
    ########################################
    ########################################
    ### Install Windows Subsystem for Linux (via WinGet)
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      dependsOn:
        - Microsoft-Windows-Subsystem-Linux
        - VirtualMachinePlatform
        - HypervisorPlatform
        - RebootForWSL
      directives:
        description: WSL
        allowPrerelease: true
      settings:
        id: "Microsoft.WSL"
        source: winget  
    ### Install Ubuntu for WSL
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      dependsOn:
        - wsl
      directives:
        description: Ubuntu
        allowPrerelease: true
      settings:
        id: Canonical.Ubuntu
        source: winget 

    ########################################
    ### Reboot if required for WSL features
    ### -------------------------------------
    - resource: PSDscResources/DSCReboot
      id: RebootForWSL
      dependsOn:
        - Microsoft-Windows-Subsystem-Linux
        - VirtualMachinePlatform
        - HypervisorPlatform
      settings:
        Name: RebootForWSL
        Skip: false

    ########################################
    ### Install Docker Desktop
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: docker-desktop
      dependsOn:
        - Microsoft-Windows-Subsystem-Linux
        - VirtualMachinePlatform
      directives:
        description: Docker Desktop
        allowPrerelease: true
      settings:
        id: "Docker.DockerDesktop"
        source: winget
