# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  ########################################
  ### ASSERTIONS: System Requirements
  ########################################
  assertions:
    ### Assertion: OS Version
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/OsVersion
      id: OsVersion
      directives:
        description: Minimum OS version requirement
        allowPrerelease: true
      settings:
        MinVersion: "10.0.22000"
  ########################################
  resources:
    ########################################
    ### Install Pre-Requisites Packages
    ########################################
    ### Install Powershell
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Powershell
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
        source: winget
    ### Install Edge
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Edge
        allowPrerelease: true
      settings:
        id: Microsoft.MicrosoftEdge
        source: winget

    ########################################
    ### Essential Configuration
    ########################################
    ########################################
    ### Enable: Developer Mode
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/DeveloperMode
      directives:
        description: Enable Developer Mode
        allowPrerelease: true
      settings:
        Ensure: Present
     ### Show file extensions and hidden files
     ### -------------------------------------
    - resource: Microsoft.Windows.Developer/WindowsExplorer
      directives:
        description: Show File Extensions and hidden files
        allowPrerelease: true
      settings:
        FileExtensions: Show
        HiddenFiles: Show
    ### Set theme to Dark
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/EnableDarkMode
      directives:
        description: Set theme to Dark
        allowPrerelease: true
      settings:
        Ensure: Present
        RestartExplorer: true
    ### Set Desktop Background to Dark Theme
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/DesktopBackground
      directives:
        description: Set Desktop Background to Dark Theme
        allowPrerelease: true
      settings:
        DesktopBackground: Dark
    ### Set Power Plan to High Performance when plugged in
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/PowerPlan
      directives:
        description: Set Power Plan to High Performance when plugged in
        allowPrerelease: true
      settings:
        PowerPlan: HighPerformance
        ACSettingIndex: 0
    ### Set Power Plan to Balanced when on battery
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/PowerPlan
      directives:
        description: Set Power Plan to Balanced when on battery
        allowPrerelease: true
      settings:
        PowerPlan: Balanced
        DCSettingIndex: 0
    ### Set Regional Settings to PT-PT
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/RegionalSettings
      directives:
        description: Set Regional Settings to PT-PT
        allowPrerelease: true
      settings:
        Locale: pt-PT
        DateFormat: dd-MM-yyyy
        TimeFormat: HH:mm:ss
        FirstDayOfWeek: 1
    ### Set Time Zone to WET  (UTC+0)
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/TimeZone
      directives:
        description: Set Time Zone to WET (UTC+0)
        allowPrerelease: true
      settings:
        TimeZone: W. Europe Standard Time
    ### Set Keyboard Layout to PT-PT
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/KeyboardLayout
      directives:
        description: Set Keyboard Layout to PT-PT
        allowPrerelease: true
      settings:
        KeyboardLayout: 0816:00000816
    ### Set Display Language to PT-PT
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/DisplayLanguage
      directives:
        description: Set Display Language to PT-PT
        allowPrerelease: true
      settings:
        DisplayLanguage: pt-PT
    ### Set Input Language to PT-PT
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/InputLanguage
      directives:
        description: Set Input Language to PT-PT
        allowPrerelease: true
      settings:
        InputLanguage: pt-PT
    ### Set Default Browser to Edge
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/DefaultBrowser
      directives:
        description: Set Default Browser to Edge
        allowPrerelease: true
      settings:
        DefaultBrowser: Microsoft.MicrosoftEdge_8wekyb3d8bbwe
    ### Set Default PDF to Edge
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/DefaultPDF
      directives:
        description: Set Default PDF to Edge
        allowPrerelease: true
      settings:
        DefaultPDF: Microsoft.MicrosoftEdge_8wekyb3d8bbwe

  ########################################