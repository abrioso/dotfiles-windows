# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  ########################################
  ### ASSERTIONS: System Requirements
  ########################################
  assertions:
    ### Assertion: OS Version
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/OsVersion
      id: OsVersion
      directives:
        description: Minimum OS version requirement
        allowPrerelease: true
      settings:
        MinVersion: "10.0.22000"
  ########################################

  resources:
    ########################################
    ### Install Office Packages
    ########################################
    ### Install VideoLAN VLC Media Player
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vlc
      directives:
        description: Install VideoLAN VLC Media Player
        allowPrerelease: true
      settings:
        id: VideoLAN.VLCMediaPlayer
        source: winget
    ### Install OBS Studio
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: obs
      directives:
        description: Install OBS Studio
        allowPrerelease: true
      settings:
        id: OBSProject.OBSStudio
        source: winget
    ### Install Audacity
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: audacity
      directives:
        description: Install Audacity
        allowPrerelease: true
      settings:
        id: Audacity.Audacity
        source: winget
    ### Install HandBrake
    ### -------------------------------------
