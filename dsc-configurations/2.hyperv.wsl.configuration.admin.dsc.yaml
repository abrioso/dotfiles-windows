# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  ########################################
  ### ASSERTIONS: System Requirements
  ########################################
  assertions:
    ### Assertion: OS Version
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/OsVersion
      id: OsVersion
      directives:
        description: Minimum OS version requirement
        allowPrerelease: true
      settings:
        MinVersion: "10.0.22000"
  ########################################
  resources:
    ########################################
    ### Initialization
    ########################################
    ########################################
    ### Install HypervisorPlatform Optional Feature
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: HypervisorPlatform
      directives:
        description: HypervisorPlatform
        allowPrerelease: true
      settings:
        Name: HypervisorPlatform
        Ensure: Present
    ### Install VirtualMachinePlatform Optional Feature
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: VirtualMachinePlatform
      directives:
        description: VirtualMachinePlatform
        allowPrerelease: true
      settings:
        Name: VirtualMachinePlatform
        Ensure: Present
    ### Install Microsoft-Windows-Subsystem-Linux Optional Feature
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: Microsoft-Windows-Subsystem-Linux
      directives:
        description: Microsoft-Windows-Subsystem-Linux
        allowPrerelease: true
      settings:
        Name: Microsoft-Windows-Subsystem-Linux
        Ensure: Present
    ########################################
    ### Install HyperV
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: hyperv 
      directives:
        description: Microsoft-Hyper-V-All 
        allowPrerelease: true
      settings:
        Name: Microsoft-Hyper-V-All 
        Ensure: Present
    ########################################
    ### Install HyperV-Tools
    ### -------------------------------------
    - resource: PSDscResources/WindowsOptionalFeature
      id: hyperv-tools 
      directives:
        description: Microsoft-Hyper-V-Tools-All 
        allowPrerelease: true
      settings:
        Name: Microsoft-Hyper-V-Tools-All 
        Ensure: Present
    ########################################
    ### Install Windows Subsystem for Linux
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      dependsOn:
        - Microsoft-Windows-Subsystem-Linux
      directives:
        description: WSL
        allowPrerelease: true
      settings:
        id: "Microsoft.WSL"
        source: winget  
    ### Install Ubuntu 24.04 LTS (WSL)
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      dependsOn:
        - wsl
      directives:
        description: Ubuntu 24.04 LTS
        allowPrerelease: true
      settings:
        id: Canonical.Ubuntu.2404
        source: winget 
    ########################################
    ### Install Powershell
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Powershell
      directives:
        description: Install Powershell
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
        source: winget
    ########################################
    ### Install Windows Terminal
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: WindowsTerminal
      directives:
        description: Install Windows Terminal
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsTerminal
        source: winget
    ########################################
    ### Configuration
    ########################################
    ########################################
    ### Add current user to Hyper-V Administrators group
    ### -------------------------------------
    # In the HyperVAdminGroup resource settings:
    - resource: PSDscResources/Script
      id: HyperVAdminGroup
      directives:
        description: Add current user to Hyper-V Administrators group
        allowPrerelease: true
      settings:
        SetScript: |
          try {
            # Get the current user identity
            $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $currentUserSID = $currentUser.User.Value
            
            # Direct approach using NET command which works better with Azure AD accounts
            $username = $currentUser.Name
            Write-Host "Current user: $username (SID: $currentUserSID)"
            
            # First check if user is already a member using direct command
            $groupMembers = net localgroup "Hyper-V Administrators" | Out-String
            
            if ($groupMembers -match [regex]::Escape($username)) {
              Write-Host "User is already a member of Hyper-V Administrators group (verified with NET command)"
              # Exit early - success condition
              return
            }
            
            # Try the .NET method first
            try {
              $hyperVGroup = [ADSI]"WinNT://./Hyper-V Administrators,group"
              $members = @($hyperVGroup.Invoke("Members"))
              $isAlreadyMember = $false
              
              foreach ($member in $members) {
                $memberPath = $member.GetType().InvokeMember("ADsPath", 'GetProperty', $null, $member, $null)
                if ($memberPath -match $currentUserSID) {
                  $isAlreadyMember = $true
                  break
                }
              }
              
              if (-not $isAlreadyMember) {
                # Using the native NET command as a fallback which works better with Azure AD
                try {
                  $result = net localgroup "Hyper-V Administrators" $username /add
                  Write-Host "Added $username to Hyper-V Administrators group using NET command"
                }
                catch {
                  # Check if the error is "already a member"
                  if ($_.Exception.Message -match "already a member" -or $_.Exception.Message -match "1378") {
                    Write-Host "User is already a member of Hyper-V Administrators group (detected from error)"
                    # Not a real error - this is actually a success condition
                  }
                  else {
                    throw $_
                  }
                }
              } else {
                Write-Host "User is already a member of Hyper-V Administrators group (detected with ADSI)"
              }
            }
            catch {
              Write-Host "First method failed: $_"
              
              # Fallback to NET command
              try {
                $result = net localgroup "Hyper-V Administrators" $username /add
                Write-Host "Added $username to Hyper-V Administrators group using NET command"
              }
              catch {
                # Check if the error is "already a member"
                if ($_.Exception.Message -match "already a member" -or $_.Exception.Message -match "1378") {
                  Write-Host "User is already a member of Hyper-V Administrators group (detected from error)"
                  # Not a real error - this is actually a success condition
                }
                else {
                  Write-Host "Failed to add user to Hyper-V Administrators: $_"
                  throw $_
                }
              }
            }
          }
          catch {
            # Check if the error is about "already a member"
            if ($_.Exception.Message -match "already a member" -or $_.Exception.Message -match "1378") {
              Write-Host "User is already a member of Hyper-V Administrators group (caught in outer catch)"
              # This is actually a success scenario
            }
            else {
              Write-Host "Error managing Hyper-V Administrators group: $_"
              throw $_
            }
          }
        GetScript: |
          return @{ Result = "N/A" }
        TestScript: |
          # Check if the user is already a member of the Hyper-V Administrators group
          try {
            $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $username = $currentUser.Name
            
            # Use NET command to check membership
            $groupMembers = net localgroup "Hyper-V Administrators" | Out-String
            return ($groupMembers -match [regex]::Escape($username))
          }
          catch {
            # If we can't determine membership, assume we need to run the script
            return $false
          }
########################################
