# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  ########################################
  ### ASSERTIONS: System Requirements
  ########################################
  assertions:
    ### Assertion: OS Version
    ### -------------------------------------
    - resource: Microsoft.Windows.Developer/OsVersion
      id: OsVersion
      directives:
        description: Minimum OS version requirement
        allowPrerelease: true
      settings:
        MinVersion: "10.0.22000"
  ########################################

  resources:
    ########################################
    ### Install Office Packages
    ########################################
    ### Install Edge
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: edge
      directives:
        description: Install Edge
        allowPrerelease: true
      settings:
        id: Microsoft.Edge
        source: winget
    ### Install Microsoft Office 365
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: office
      directives:
        description: Install Microsoft Office 365
        allowPrerelease: true
      settings:
        id: Microsoft.Office
        source: winget
    ### Install Microsoft Teams
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: teams
      directives:
        description: Install Microsoft Teams
        allowPrerelease: true
      settings:
        id: Microsoft.Teams
        source: winget
    ### Install Microsoft OneDrive
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: onedrive
      directives:
        description: Install Microsoft OneDrive
        allowPrerelease: true
      settings:
        id: Microsoft.OneDrive
        source: winget
    ### Install Microsoft Power BI
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powerbi
      directives:
        description: Install Microsoft Power BI
        allowPrerelease: true
      settings:
        id: Microsoft.PowerBI
        source: winget
